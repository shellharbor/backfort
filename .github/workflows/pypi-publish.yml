name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Trusted-publisher destination (run only from a release tag)'
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

permissions:
  contents: read

concurrency:
  group: python-publish-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Require a confirmed matching release tag
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(sed -n 's/^readonly BACKFORT_VERSION="\([^"]*\)"$/\1/p' backfort.sh)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF" == "refs/tags/v${version}" ]]
          [[ "$(python run_backfort.py --version)" == "Backfort ${version}" ]]
          grep -Fqx "## ${version}" CHANGELOG.md
      - name: Install development dependencies
        run: python -m pip install '.[dev]'
      - name: Test launcher
        run: python -m coverage run -m unittest discover -s tests -p 'test_python_*.py' -v
      - name: Check coverage
        run: python -m coverage report
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        shell: bash
        run: |
          python -m twine check --strict dist/*
          python tests/python_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.repository == 'shellharbor/backfort'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.repository }}
      url: ${{ inputs.repository == 'pypi' && 'https://pypi.org/p/backfort' || 'https://test.pypi.org/p/backfort' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-release-distributions
          path: dist
      - name: Publish through the configured trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
