name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Bash and smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify executable entrypoints from a clean checkout
        run: |
          for file in \
            backfort.sh \
            scripts/install.sh \
            tests/fake-age.sh \
            tests/fake-docker.sh \
            tests/fake-minisign.sh \
            tests/fake-rclone.sh; do
            test -x "$file"
          done

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl attr gnupg shellcheck python3
          go install github.com/mikefarah/yq/v4@v4.45.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check shell syntax
        run: bash -n backfort.sh tests/*.sh

      - name: Check Bash 4.3 syntax compatibility
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            bash:4.3.48 \
            bash -c '[[ "$BASH_VERSION" == 4.3.* ]] && bash -n backfort.sh tests/*.sh'

      - name: Run Bash 4.3 runtime regression test
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            bash:4.3.48 \
            bash tests/bash43-runtime.sh

      - name: Validate example YAML
        run: |
          for file in examples/*.yaml; do
            yq eval '.' "$file" >/dev/null
          done

      - name: Run ShellCheck
        run: shellcheck backfort.sh tests/*.sh

      - name: Run smoke test
        run: bash tests/smoke.sh

      - name: Run shared-destination host scope test
        run: bash tests/host-scope.sh

      - name: Run workspace failure test
        run: bash tests/workspace-failure.sh

      - name: Run local durability test
        run: bash tests/local-durability.sh

      - name: Run per-file hash test
        run: bash tests/file-hashes.sh

      - name: Run archive resilience test
        run: bash tests/archive-resilience.sh

      - name: Run restore fidelity test
        run: bash tests/fidelity.sh

      - name: Run quick backup test
        run: bash tests/quick.sh

      - name: Run rclone smoke test
        run: bash tests/rclone-smoke.sh

      - name: Run Docker Compose smoke test
        run: bash tests/compose-smoke.sh

      - name: Run Compose restore assistant test
        run: bash tests/restore-compose.sh

      - name: Run encryption and signing smoke test
        run: bash tests/crypto-smoke.sh

      - name: Run asymmetric GPG integration test
        run: bash tests/gpg-asymmetric.sh

      - name: Run watchdog test
        run: bash tests/watchdog.sh

      - name: Run backup diff test
        run: bash tests/diff.sh

      - name: Run pinned backup test
        run: bash tests/pinned.sh

      - name: Run date-range deletion test
        run: bash tests/delete-period.sh

      - name: Run interactive restore pick test
        run: bash tests/pick.sh

      - name: Run notification test
        run: bash tests/notify.sh

      - name: Run lifecycle hooks test
        run: bash tests/hooks.sh

      - name: Run Prometheus metrics test
        run: bash tests/metrics.sh

      - name: Run preflight failure observability test
        run: bash tests/preflight-failure.sh
