name: Release metadata

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release version and tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Verify version, CLI, changelog, and tag
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(sed -n 's/^readonly BACKFORT_VERSION="\([^"]*\)"$/\1/p' backfort.sh)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]]
          [[ "$(bash ./backfort.sh --version)" == "Backfort ${version}" ]]
          grep -Fqx "## ${version}" CHANGELOG.md
          IFS=. read -r major minor _ <<<"$version"
          printf 'version=%s\nmajor=%s\nminor=%s\n' "$version" "$major" "$minor" >>"$GITHUB_OUTPUT"

  docker-smoke:
    name: Test Docker image (${{ matrix.platform }})
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            image_suffix: amd64
          - platform: linux/arm64
            image_suffix: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU for non-native images
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build release image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: backfort:release-test-${{ matrix.image_suffix }}
          cache-from: type=gha,scope=backfort-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=backfort-${{ matrix.platform }}
      - name: Run image smoke test
        run: bash tests/docker-image.sh backfort:release-test-${{ matrix.image_suffix }}

  publish-ghcr:
    name: Publish GHCR image
    needs: [verify, docker-smoke]
    if: ${{ github.repository == 'shellharbor/backfort' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite the immutable version tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if docker buildx imagetools inspect "ghcr.io/shellharbor/backfort:${VERSION}" >/dev/null 2>&1; then
            printf 'GHCR tag %s already exists; release version tags are immutable.\n' "$VERSION" >&2
            exit 1
          fi
      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/shellharbor/backfort
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=${{ needs.verify.outputs.major }}.${{ needs.verify.outputs.minor }}
            type=raw,value=${{ needs.verify.outputs.major }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Backfort
            org.opencontainers.image.description=Recovery-first Linux backup and restore tool
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/shellharbor/backfort
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backfort-release
          cache-to: type=gha,mode=max,scope=backfort-release

  dockerhub-gate:
    name: Check optional Docker Hub credentials
    needs: [verify, docker-smoke, publish-ghcr]
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.credentials.outputs.enabled }}
    steps:
      - id: credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            printf 'enabled=true\n' >>"$GITHUB_OUTPUT"
          else
            printf 'enabled=false\n' >>"$GITHUB_OUTPUT"
          fi

  publish-dockerhub:
    name: Publish Docker Hub image
    needs: [verify, docker-smoke, dockerhub-gate]
    if: ${{ needs.dockerhub-gate.outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Refuse to overwrite the immutable version tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if docker buildx imagetools inspect "docker.io/shellharbor/backfort:${VERSION}" >/dev/null 2>&1; then
            printf 'Docker Hub tag %s already exists; release version tags are immutable.\n' "$VERSION" >&2
            exit 1
          fi
      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: docker.io/shellharbor/backfort
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=${{ needs.verify.outputs.major }}.${{ needs.verify.outputs.minor }}
            type=raw,value=${{ needs.verify.outputs.major }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Backfort
            org.opencontainers.image.description=Recovery-first Linux backup and restore tool
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/shellharbor/backfort
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backfort-dockerhub-release
          cache-to: type=gha,mode=max,scope=backfort-dockerhub-release
