# Valid Backfort 1.2 configuration: encrypted offsite copy. The recipient and
# private identity are environment-variable references, never secret values.
# A production writer may omit BACKFORT_AGE_IDENTITY_FILE; it can create and
# quick-verify backups but cannot decrypt or restore them.

version: 1

settings:
  host_id: docs-01
  state_directory: /var/lib/backfort
  temp_directory: /var/tmp/backfort
  lock_file: /run/backfort.lock
  min_free_mb: 1024

destinations:
  - name: encrypted-offsite
    type: rclone
    remote: team-dropbox
    path: Backfort/docs-01

jobs:
  - name: documents
    source:
      type: files
      paths:
        - /srv/documents
      exclude:
        - "*.tmp"
        - "*/.cache/*"
      follow_symlinks: false

    destinations: [encrypted-offsite]
    success:
      min_copies: 1

    compression: {method: zstd, level: 6}
    encryption:
      method: age
      recipient_env: BACKFORT_AGE_RECIPIENT
      identity_file_env: BACKFORT_AGE_IDENTITY_FILE

    retention:
      keep_last: 7
      keep_daily: 30
      keep_weekly: 12
      keep_monthly: 24
