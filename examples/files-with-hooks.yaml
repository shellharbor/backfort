version: 1

settings:
  host_id: crm-01
  state_directory: /var/lib/backfort
  temp_directory: /var/tmp/backfort
  lock_file: /run/backfort.lock
  min_free_mb: 1024

destinations:
  - name: local
    type: local
    path: /var/backups/backfort
  - name: offsite
    type: rclone
    remote: company-r2
    path: production-backups/backfort/crm-01

jobs:
  - name: crm-files
    source:
      type: files
      paths: [/etc/crm, /srv/crm-data]
      exclude: ["*.log", "*/cache/*"]
      follow_symlinks: false
    hooks:
      pre:
        path: /usr/local/lib/backfort/hooks/crm-maintenance
        args: [enable]
      post:
        path: /usr/local/lib/backfort/hooks/crm-maintenance
        args: [disable]
    destinations: [local, offsite]
    success: {min_copies: 2}
    compression: {method: zstd, level: 10}
    encryption: {method: age, recipient_env: BACKFORT_AGE_RECIPIENT}
    retention: {keep_last: 7, keep_daily: 14, keep_weekly: 8, keep_monthly: 12}
