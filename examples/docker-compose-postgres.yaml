# PostgreSQL Compose project with one non-database named volume, an explicit
# bind mount and an offsite rclone copy. Replace every example path, remote,
# image digest and environment-variable name before use.

version: 1

settings:
  host_id: crm-01
  state_directory: /var/lib/backfort
  temp_directory: /var/tmp/backfort
  lock_file: /run/backfort.lock
  min_free_mb: 4096

destinations:
  - name: local-recovery
    type: local
    path: /var/backups/backfort

  - name: s3-offsite
    type: rclone
    remote: company-s3
    path: company-backups/backfort/crm-01

jobs:
  - name: crm-production
    source:
      type: docker_compose
      project_dir: /srv/crm
      files: [compose.yaml, compose.production.yaml]

      # Compose logical volume names. Do not include the PostgreSQL data volume:
      # the logical dump below is the application-consistent database backup.
      volumes: [uploads]
      volume_helper_image: registry.example/backfort-volume-helper@sha256:REPLACE_WITH_DIGEST

      # Explicit host paths relative to project_dir; .env is never implicit.
      bind_mounts:
        - name: uploads
          path: data/uploads

      databases:
        - name: crm-postgres
          service: postgres
          engine: postgres
          user: backfort
          password_env: BACKFORT_PG_PASSWORD
          databases: [crm]
          include_globals: true

    destinations: [local-recovery, s3-offsite]
    success:
      min_copies: 2

    compression: {method: zstd, level: 6}
    encryption:
      method: age
      recipient_env: BACKFORT_AGE_RECIPIENT

    retention:
      keep_last: 7
      keep_daily: 14
      keep_weekly: 8
      keep_monthly: 12
