# Valid Backfort 0.5 configuration: a local backup and Prometheus metrics for
# node_exporter's textfile collector. Create the metrics directory separately.

version: 1

settings:
  host_id: app-01
  state_directory: /var/lib/backfort
  temp_directory: /var/tmp/backfort
  lock_file: /run/backfort.lock
  min_free_mb: 1024

metrics:
  prometheus:
    textfile_directory: /var/lib/node_exporter/textfile_collector

destinations:
  - name: local-recovery
    type: local
    path: /var/backups/backfort

jobs:
  - name: application
    source:
      type: files
      paths: [/etc/myapp, /srv/myapp/uploads]
      exclude: ["*.log", "*/cache/*", "*/node_modules/*"]
      follow_symlinks: false
    destinations: [local-recovery]
    success: {min_copies: 1}
    compression: {method: zstd, level: 10}
    encryption: {method: none}
    retention: {keep_last: 7, keep_daily: 14, keep_weekly: 8, keep_monthly: 12}
