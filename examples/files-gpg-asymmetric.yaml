# Valid Backfort 1.1 configuration: GPG public-key encryption for an offsite
# copy. Import the two verified public keys into the account that runs Backfort
# first. This server intentionally has no private key and can therefore create
# backups and quick-verify them, but cannot decrypt them.

version: 1

settings:
  host_id: app-01
  state_directory: /var/lib/backfort
  temp_directory: /var/tmp/backfort
  lock_file: /run/backfort.lock
  min_free_mb: 1024

destinations:
  - name: encrypted-offsite
    type: rclone
    remote: cloudflare-r2
    path: Backfort/app-01

jobs:
  - name: application-data
    source:
      type: files
      paths:
        - /srv/application
      exclude:
        - "*/.cache/*"
        - "*.tmp"
      follow_symlinks: false

    destinations: [encrypted-offsite]
    success: {min_copies: 1}
    compression: {method: zstd, level: 6}

    encryption:
      method: gpg
      recipients_env:
        - BACKFORT_GPG_RECIPIENT_PRIMARY
        - BACKFORT_GPG_RECIPIENT_RECOVERY
      # Set this only on the separate recovery host when the private key needs
      # a passphrase for unattended full verification or restore.
      identity_password_env: BACKFORT_GPG_IDENTITY_PASSWORD

    retention:
      keep_last: 7
      keep_daily: 30
      keep_weekly: 12
      keep_monthly: 24
